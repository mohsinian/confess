# GitLab CI (free tier). GitLab free cannot pull-mirror GitHub repositories
# (that's Premium), so this pipeline clones the public GitHub repository
# directly and runs the full check sequence on a schedule: typecheck →
# no-LLM self-tests → offline eval reproduction (F1 75.7 / 82.4).
sync-and-check:
  image: node:22
  script:
    - git clone --depth 1 https://github.com/mohsinian/confess.git repo
    - cd repo
    - npm ci --no-audit --no-fund
    - npx tsc --noEmit
    - npm run selftest
    - npm run eval -- --run baseline
    - npm run eval -- --run agent
