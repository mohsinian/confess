name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Self-tests (59 checks — no API key needed)
        run: npm run selftest
      - name: Offline eval reproduction (path A)
        run: |
          npm run eval -- --run baseline
          npm run eval -- --run agent
