# CI on Azure Pipelines — the free grant for open-source projects (no payment
# method). Replaces the retired Cirrus CI config, which replaced GitHub Actions
# (blocked by an account billing hold). Same sequence throughout: typecheck →
# no-LLM self-tests → offline eval reproduction (F1 75.7 / 82.4).
trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseNode@1
    inputs:
      version: 22.x
    displayName: Node 22

  - script: npm ci
    displayName: npm ci

  - script: npx tsc --noEmit
    displayName: Typecheck

  - script: npm run selftest
    displayName: Self-tests (59 no-LLM checks)

  - script: |
      npm run eval -- --run baseline
      npm run eval -- --run agent
    displayName: Offline eval reproduction
