# CI for the public repo, hosted on Cirrus CI — free for public repositories,
# no payment method required (GitHub Actions is unavailable on this account
# due to a billing hold). Same sequence the Actions workflow ran:
# typecheck → no-LLM self-tests → offline eval reproduction (F1 75.7 / 82.4).
task:
  name: test
  container:
    image: node:22

  node_modules_cache:
    folder: node_modules
    fingerprint_script: cat package-lock.json
    populate_script: npm ci

  typecheck_script: npx tsc --noEmit
  selftest_script: npm run selftest
  eval_script: |
    npm run eval -- --run baseline
    npm run eval -- --run agent
